[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Never cache the service worker itself, so app updates reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Short link printed at the end of Strava posts, so usage counts know the visit came from Strava.
[[redirects]]
  from = "/s"
  to = "/?src=strava"
  status = 302

# Short links for Instagram (bio link and DMs), so usage counts know where a visit came from.
[[redirects]]
  from = "/ig"
  to = "/?src=ig"
  status = 302

[[redirects]]
  from = "/dm"
  to = "/?src=dm"
  status = 302
